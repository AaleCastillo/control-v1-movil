name: Construir APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar web
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Agregar plugin de conexion a la TV
        run: |
          D=android/app/src/main/java/com/miremoto/tv
          mkdir -p $D
          cp MainActivity.java TvRemotePlugin.java $D/

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: control-remoto-tv-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
